name: Incoming2
options:
  bundleIdPrefix: com.osmcreations
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: F34Q6U9QKH
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 2.0.0

targets:
  Incoming2:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Incoming
        excludes:
          - Info.plist
          - Incoming.entitlements
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmcreations.incoming2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Incoming/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Incoming/Incoming.entitlements
    dependencies:
      - target: IncomingClip

  IncomingClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/IncomingClip
        excludes:
          - Info.plist
          - IncomingClip.entitlements
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmcreations.incoming2.Clip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/IncomingClip/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/IncomingClip/IncomingClip.entitlements

schemes:
  Incoming2:
    build:
      targets:
        Incoming2: all
        IncomingClip: all
    run:
      config: Debug
  IncomingClip:
    build:
      targets:
        IncomingClip: all
    run:
      config: Debug
