name: Incoming2
options:
  bundleIdPrefix: com.osmcreations
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 2.0.0

targets:
  Incoming2:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Incoming
    resources:
      - path: Sources/Incoming/Resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmcreations.incoming2
        INFOPLIST_KEY_CFBundleDisplayName: Incoming 2.0
    info:
      path: Sources/Incoming/Info.plist
      properties:
        CFBundleDisplayName: Incoming 2.0
        UILaunchScreen: {}
        API_BASE_URL: $(API_BASE_URL)
        PUBLIC_BASE_URL: $(PUBLIC_BASE_URL)
        NFCReaderUsageDescription: Incoming writes your App Clip link to compatible NFC tags.
    entitlements:
      path: Sources/Incoming/Incoming.entitlements
    dependencies:
      - target: IncomingClip

  IncomingClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/IncomingClip
    resources:
      - path: Sources/IncomingClip/Resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmcreations.incoming2.Clip
        INFOPLIST_KEY_CFBundleDisplayName: Incoming
    info:
      path: Sources/IncomingClip/Info.plist
      properties:
        CFBundleDisplayName: Incoming
        UILaunchScreen: {}
        API_BASE_URL: $(API_BASE_URL)
        PUBLIC_BASE_URL: $(PUBLIC_BASE_URL)
    entitlements:
      path: Sources/IncomingClip/IncomingClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)com.osmcreations.incoming2

schemes:
  Incoming2:
    build:
      targets:
        Incoming2: all
        IncomingClip: all
    run:
      config: Debug
  IncomingClip:
    build:
      targets:
        IncomingClip: all
    run:
      config: Debug
