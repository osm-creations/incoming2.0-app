name: Verify caller capitalization and gray caller backdrop
on:
  push:
    branches: ['verify/caller-display-build17']
permissions:
  contents: read
jobs:
  clip:
    runs-on: macos-15
    timeout-minutes: 28
    defaults:
      run:
        working-directory: .github/ui-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start iPhone simulator
        run: |
          bash select-xcode.sh
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          python3 choose-simulator.py large
          device="$(tail -2 "$GITHUB_ENV" | sed -n 's/^DEVICE=//p')"
          xcrun simctl boot "$device"
      - name: Prepare the App Clip fixture
        run: |
          if ! command -v xcodegen >/dev/null; then HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; fi
          xcodegen generate
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl status_bar "$DEVICE" override --time 10:23 --batteryState discharging --batteryLevel 49 || true
      - name: Verify stored, Inject, note and mixed-case caller display
        run: |
          set -euo pipefail
          python3 -u worker_fixture.py > worker.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" || true' EXIT
          for i in {1..12}; do curl -fsS http://127.0.0.1:8743/ready && break; sleep 1; done
          xcodebuild -project ClipSmoke.xcodeproj -scheme ClipHost -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO \
            -resultBundlePath Clip.xcresult test > test.log 2>&1 || { tail -150 test.log; tail -30 worker.log; exit 1; }
          curl -fsS http://127.0.0.1:8743/verified | python3 -c 'import sys,json; c=json.load(sys.stdin)["data"]; print("CALLER-QA fixture counts",c); assert {k:v for k,v in c.items() if k.startswith(("black-","selection-"))} == {"black-standard":3,"black-plain":1,"selection-standard":1},c' 
          grep -E 'CALLER-QA|Executed [0-9]+ tests|TEST SUCCEEDED' test.log
      - name: Export screenshots
        if: always()
        run: |
          if test -d Clip.xcresult; then xcrun xcresulttool export attachments --path Clip.xcresult --output-path captures; fi
          echo "$SIM_MODEL" > device.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caller-display-build17
          path: |
            .github/ui-smoke/captures
            .github/ui-smoke/device.txt
            .github/ui-smoke/test.log
            .github/ui-smoke/worker.log
