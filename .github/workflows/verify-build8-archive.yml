name: Verify Incoming build 8 device archive
on:
  push:
    branches: ['verify/ios-build8-archive']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select installed Xcode
        run: bash .github/ui-smoke/select-xcode.sh
      - name: Clean simulator build of the app and embedded Clip
        run: |
          set -euo pipefail
          xcodebuild -workspace Incoming2.xcworkspace -scheme Incoming2 -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            clean build > "$RUNNER_TEMP/simulator.log" 2>&1 || { tail -250 "$RUNNER_TEMP/simulator.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/simulator.log"
      - name: Archive Release for iPhone without signing or distribution
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Incoming.xcarchive"
          xcodebuild -workspace Incoming2.xcworkspace -scheme Incoming2 -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -250 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/archive.log"
          app="$archive/Products/Applications/Incoming2.app"
          clip="$app/AppClips/IncomingClip.app"
          test -f "$app/Incoming2" && test -f "$clip/IncomingClip"
          for product in "$app" "$clip"; do
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$product/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$product/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$product/Info.plist")" = 8
          done
