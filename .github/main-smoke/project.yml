name: DashboardSmoke
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  IncomingHost:
    type: application
    platform: iOS
    sources:
      - path: ../../Sources/Incoming
        excludes: [Info.plist, Incoming.entitlements]
      - path: ../../Sources/Shared
      - path: Host/FixtureSession.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmcreations.uitest.DashboardHost
        INFOPLIST_FILE: Host/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DashboardTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
      - path: ../../Sources/Incoming/Services/NFCWriterService.swift
    dependencies:
      - target: IncomingHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmcreations.uitest.DashboardTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IncomingHost
schemes:
  IncomingHost:
    build:
      targets:
        IncomingHost: all
    test:
      targets: [DashboardTests]
