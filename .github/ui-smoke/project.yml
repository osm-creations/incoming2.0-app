name: ClipSmoke
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ClipHost:
    type: application
    platform: iOS
    sources:
      - path: ../../Sources/Shared
        excludes: [Resources]
      - path: ../../Sources/IncomingClip
        excludes: [App/IncomingClipApp.swift, Info.plist, IncomingClip.entitlements]
      - path: ../../Sources/Incoming/App/AppSession.swift
      - path: ../../Sources/Incoming/Services/KeychainStore.swift
      - path: ../../Sources/Incoming/Features/Performance/InjectInputView.swift
      - path: Host
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmcreations.uitest.ClipHost
        INFOPLIST_FILE: Host/Info.plist
  ClipSmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ClipHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmcreations.uitest.ClipSmokeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ClipHost
schemes:
  ClipHost:
    build:
      targets:
        ClipHost: all
    test:
      targets:
        - ClipSmokeTests
